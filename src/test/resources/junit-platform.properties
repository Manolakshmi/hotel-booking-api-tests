# Cucumber settings picked up by the JUnit Platform.
# Override from the command line, e.g. -Dcucumber.filter.tags="@known-bug"
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json
cucumber.publish.quiet=true
# Default run skips scenarios that are known to fail (@known-bug) or not verified yet (@wip).
cucumber.filter.tags=not @known-bug and not @wip
